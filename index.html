<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mr. Smith's Projects</title>
<style>
  :root{ --bg:#111418; --card:#1a1f26; --line:#2c333d; --ink:#eef0f3; --dim:#9aa3b0; --accent:#f2a65a; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:820px;margin:0 auto;padding:48px 18px 60px}
  h1{font-size:36px;margin:0;letter-spacing:-.8px}
  .lede{color:var(--dim);margin:6px 0 32px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
  .card{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:20px;color:inherit;text-decoration:none}
  a.card:hover{border-color:var(--accent)}
  .tag{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--accent)}
  .card h2{margin:6px 0 4px;font-size:21px}
  .card p{margin:0;color:var(--dim);font-size:15px}
  .card.soon{border-style:dashed;opacity:.6}
  footer{margin-top:48px;color:var(--dim);font-size:14px}
  footer a{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Mr. Smith's Projects</h1>
  <p class="lede">The demo portfolio for Building with AI. Same setup as yours.</p>

  <div class="grid">
    <a class="card" href="book-picks/">
      <span class="tag">Build 1 · Memory</span>
      <h2>Book Picks</h2>
      <p>Recommend one book everyone should read, and say why.</p>
    </a>
    <div class="card soon">
      <span class="tag">Build 2 · Identity</span>
      <h2>Coming soon</h2>
      <p>Sign-in, usernames, private data and files.</p>
    </div>
  </div>

  <footer>
    Code: <a href="https://github.com/smith-teaches-tech/demo-portfolio">github.com/smith-teaches-tech/demo-portfolio</a>
  </footer>
</div>
</body>
</html>
